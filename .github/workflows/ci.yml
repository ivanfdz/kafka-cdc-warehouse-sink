---
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check src tests scripts

      - name: Ruff format check
        run: ruff format --check src tests scripts

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run tests
        # The suite is fully offline: no broker, no registry, no database.
        run: python -m pytest --cov=cdc_sink --cov-report=term-missing

  validate-manifests:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker compose
        run: docker compose config --quiet

      - name: Render kustomize overlays
        run: |
          for overlay in deploy/kubernetes/overlays/*; do
            echo "Rendering $overlay"
            kubectl kustomize "$overlay" > /dev/null
          done

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Render the Connect chart
        # Pulls the upstream Confluent chart declared as a dependency instead of
        # vendoring it, then checks that both templates render.
        run: |
          helm dependency update deploy/helm/cdc-connect
          helm lint deploy/helm/cdc-connect
          helm template cdc deploy/helm/cdc-connect > /dev/null

      - name: Assert no plaintext credential in any manifest
        # Every sensitive value must arrive through secretKeyRef. A literal
        # password or SASL string in a committed manifest fails the build.
        run: |
          set -euo pipefail
          pattern='(AKIA[0-9A-Z]{16}|sasl\.jaas\.config|BEGIN [A-Z ]*PRIVATE KEY)'
          if grep -rIEn "$pattern" deploy docker-compose.yml; then
            echo "Possible credential found in a manifest" >&2
            exit 1
          fi
          echo "No credential pattern found"

  build-image:
    name: Build image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          tags: cdc-warehouse-sink:ci
