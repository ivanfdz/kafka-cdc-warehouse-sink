---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cdc-prod
nameSuffix: -prod

resources:
  - ../../base

images:
  - name: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/cdc-warehouse-sink
    newTag: "1.0.0"

replicas:
  - name: cdc-warehouse-sink
    count: 3

configMapGenerator:
  - name: cdc-warehouse-sink-config
    behavior: merge
    literals:
      - ENVIRONMENT=prod
      - LOG_LEVEL=INFO
      - CDC_TOPIC=cdc.prod.orders
      - BATCH_SIZE=1000
      - KAFKA_BOOTSTRAP_SERVERS=kafka-prod.example.internal:9092
      - SCHEMA_REGISTRY_URL=https://schema-registry-prod.example.internal
      - WAREHOUSE_HOST=warehouse-prod.example.internal
