apiVersion: v1
kind: Secret
metadata:
  name: cdc-warehouse-sink-secrets
  labels:
    app.kubernetes.io/name: cdc-warehouse-sink
type: Opaque
stringData:
  # Kafka SASL credentials.
  kafka-sasl-username: "REPLACE_WITH_KAFKA_SASL_USERNAME"
  kafka-sasl-password: "REPLACE_WITH_KAFKA_SASL_PASSWORD"
  # Schema Registry basic auth, in "user:password" form.
  schema-registry-basic-auth: "REPLACE_WITH_SCHEMA_REGISTRY_USER:REPLACE_WITH_SCHEMA_REGISTRY_PASSWORD"
