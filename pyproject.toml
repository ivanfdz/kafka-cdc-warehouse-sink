[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdc-warehouse-sink"
version = "1.0.0"
description = "Kafka CDC consumer that applies Avro change events to an analytical warehouse in one transaction per batch, committing offsets only after the warehouse commits."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ivan Fernandez Garcia" }]
keywords = ["kafka", "cdc", "avro", "schema-registry", "warehouse", "ksqldb"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "confluent-kafka[avro,schemaregistry]==2.15.1",
    "fastavro==1.12.2",
    "psycopg2-binary==2.9.13",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.0.0",
    "ruff==0.16.8",
]

[project.scripts]
cdc-warehouse-sink = "cdc_sink.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = [
    # The batch relation is assembled from constants and bound parameters, so the
    # f-string SQL in queries.py is intentional and safe.
    "S608",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
